# Allowlist-only forward proxy (see allowlist.txt). Runs in the foreground as
# the container's non-root user; logs to stdout.
Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 20
LogLevel Info

# Only backend containers on the internal Docker networks may use it.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# HTTPS tunnels (CONNECT) only to port 443.
ConnectPort 443

# Default deny: only host names matching allowlist.txt (whole name, regex).
FilterDefaultDeny Yes
FilterURLs Off
FilterType ere
FilterCaseSensitive Off
Filter "/etc/tinyproxy/allowlist.txt"

DisableViaHeader Yes
