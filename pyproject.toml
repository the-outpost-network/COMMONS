[project]
name = "commons"
version = "0.0.0"
description = "Community-owned, locally hosted operating system for resource sharing and self-governance, built first for the Outpost."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
# Exact versions and hashes live in uv.lock / requirements.lock (`make lock`).
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",  # form posts
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",     # PostgreSQL driver
    "alembic>=1.14",
    "cryptography>=44",          # Ed25519 decision-log signatures
    "pyotp>=2.9",                # TOTP for admins
    "pyyaml>=6.0",               # community.yaml seed
    "pydantic>=2.9",             # community.yaml schema
    "numpy>=2.1",                # Holt forecasting
    "httpx>=0.28",               # internal calls to llama-server
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pip-audit>=2.7",
    "bandit>=1.8",
]

# --- Ruff -------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "bot", "scripts", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "DTZ",  # flake8-datetimez: no naive datetimes (we store UTC)
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and fixed fake secrets/tokens.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app", "bot"]

[tool.ruff.format]
quote-style = "double"

# --- Pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
# `llm` tests need a running llama-server; run them explicitly with `pytest -m llm`.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not llm"]
markers = [
    "llm: intent-parser evals against a live llama-server (tests/intent_cases.yaml)",
]
filterwarnings = [
    "error",
    # Starlette's TestClient wants the httpx2 fork; the app itself uses httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
xfail_strict = true
